spring.application.name=${APP_NAME:aiclass}

# Database Configuration - Environment Variables Required
# Set these variables in your system environment:
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${HIBERNATE_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
spring.jpa.database-platform=${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# Hibernate UUID Generator Configuration
spring.jpa.properties.hibernate.id.generator_mappings.uuid2=org.hibernate.id.UUIDGenerator
# Use native PostgreSQL UUID type instead of VARCHAR
# spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# Server Configuration
server.port=${SERVER_PORT:8080}

# Logging Configuration
logging.level.com.viveek.aiclass=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=${LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${SQL_LOG_LEVEL:TRACE}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# Supabase Configuration
# Set these in application-local.properties or environment variables
supabase.jwt.secret=${SUPABASE_JWT_SECRET}
supabase.url=${SUPABASE_URL}
supabase.anon.key=${SUPABASE_ANON_KEY}
supabase.service.role.key=${SUPABASE_SERVICE_ROLE_KEY}

# Security Configuration
# CORS - Comma-separated list of allowed origins
security.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200,https://extraordinary-maamoul-81f71e.netlify.app}

# HikariCP Connection Pool Configuration
# Very small pool size for Supabase connection limits
# With 2 machines, we use max 2 connections per machine = 4 total
# Supabase free tier typically allows 60 direct connections, but pooler has lower limits
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:2}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.idle-timeout=240000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.pool-name=StudentPerformanceHikariCP
spring.datasource.hikari.connection-test-query=SELECT 1
# Leak detection to help identify connection issues
spring.datasource.hikari.leak-detection-threshold=60000

server.address=0.0.0.0

# Monitoring & Observability Configuration
# Actuator endpoints
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Prometheus metrics
management.prometheus.metrics.export.enabled=true

# Tracing Configuration
# Disable Zipkin tracing in production (no Zipkin server configured)
management.tracing.enabled=false
management.zipkin.tracing.enabled=false

# OpenAI Configuration
openai.api.key=${OPENAI_API_KEY}
openai.api.timeout=${OPENAI_API_TIMEOUT:30000}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.max-tokens=${OPENAI_MAX_TOKENS:500}
