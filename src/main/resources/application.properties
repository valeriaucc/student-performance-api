spring.application.name=${APP_NAME:aiclass}

# Database Configuration - Environment Variables Required
# Set these variables in your system environment:
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${HIBERNATE_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
spring.jpa.database-platform=${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# Hibernate UUID Generator Configuration
spring.jpa.properties.hibernate.id.generator_mappings.uuid2=org.hibernate.id.UUIDGenerator
# Use native PostgreSQL UUID type instead of VARCHAR
# spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# Server Configuration
server.port=${SERVER_PORT:8080}

# Logging Configuration
logging.level.com.viveek.aiclass=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=${LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${SQL_LOG_LEVEL:TRACE}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# Supabase Configuration
# Set these in application-local.properties or environment variables
supabase.jwt.secret=${SUPABASE_JWT_SECRET}
supabase.url=${SUPABASE_URL}
supabase.anon.key=${SUPABASE_ANON_KEY}
supabase.service.role.key=${SUPABASE_SERVICE_ROLE_KEY}

# Security Configuration
# CORS - Comma-separated list of allowed origins
security.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}
