# Test Configuration - Uses Testcontainers with PostgreSQL
# Database configuration is provided by @DynamicPropertySource in test classes
# This ensures tests run against real PostgreSQL (same as production)

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Test Configuration (dummy values for tests)
supabase.jwt.secret=test-secret-key-at-least-32-characters-long-for-hs256-algorithm
supabase.jwt.audience=authenticated
supabase.jwt.issuer=https://test.supabase.co/auth/v1

# Supabase Configuration (dummy values for tests - health checks will fail but app will start)
supabase.url=https://test.supabase.co
supabase.api.key=test-api-key

# CORS Configuration
security.cors.allowed-origins=http://localhost:3000

