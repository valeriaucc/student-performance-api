# Test Configuration - Uses H2 in-memory database
# This avoids needing real Supabase credentials for tests

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT Test Configuration (dummy values for tests)
supabase.jwt.secret=test-secret-key-at-least-32-characters-long-for-hs256-algorithm
security.cors.allowed-origins=http://localhost:3000

# Disable Supabase connection for tests
spring.autoconfigure.exclude=

